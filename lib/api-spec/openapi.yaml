openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /checkout/quote:
    post:
      operationId: createCheckoutQuote
      summary: Lock a server-priced USD test payment quote for 15 minutes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutInput" }
      responses:
        "201":
          description: USD quote, requiring customer confirmation before Stripe checkout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutQuote" }
        "400": { description: Invalid cart }
        "409": { description: Quote expired or changed }
        "503": { description: Rates or checkout unavailable }
  /checkout:
    post:
      operationId: createCheckout
      summary: Confirm an owned USD quote and create a test-only Stripe hosted checkout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutConfirmation" }
      responses:
        "201":
          description: Test checkout created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutLink" }
        "400": { description: Invalid cart }
        "403": { description: Cross-site request }
        "409": { description: Cart or previous checkout changed }
        "429": { description: Too many checkout attempts }
        "503": { description: Test checkout unavailable }
  /checkout/session:
    get:
      operationId: getCheckoutSession
      summary: Verify payment directly with Stripe for the checkout cookie owner
      parameters:
        - in: query
          name: session_id
          required: true
          schema: { type: string, pattern: "^cs_test_[A-Za-z0-9]+$", maxLength: 255 }
      responses:
        "200":
          description: Verified payment status; never inferred from the return URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutStatus" }
        "400": { description: Invalid session }
        "404": { description: Checkout not found for this visitor }
        "503": { description: Payment verification unavailable }
  /stripe/webhook:
    post:
      operationId: receiveStripeWebhook
      summary: Receive raw, signature-verified Stripe events
      responses:
        "200": { description: Event processed }
        "400": { description: Invalid payload or signature }
        "503": { description: Synchronization unavailable; Stripe should retry }
  /products:
    get:
      operationId: getProducts
      summary: Read all live products
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogProduct" }
        "503": { description: Database unavailable }
  /bundles:
    get:
      operationId: getBundles
      summary: Read all live bundles
      responses:
        "200":
          description: Bundles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogBundle" }
        "503": { description: Database unavailable }
  /auth/signup:
    post:
      operationId: signupCustomer
      summary: Create a customer account and session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerSignupInput" }
      responses:
        "201":
          description: Signed up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerSession" }
        "400":
          description: Invalid fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerAuthError" }
        "409":
          description: Email already in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerAuthError" }
        "403": { description: Cross-site request refused }
        "429": { description: Too many attempts }
        "503": { description: Authentication unavailable }
  /auth/login:
    post:
      operationId: loginCustomer
      summary: Start a seven-day customer session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerLoginInput" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerSession" }
        "400":
          description: Invalid fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerAuthError" }
        "401":
          description: Incorrect credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerAuthError" }
        "403": { description: Cross-site request refused }
        "429": { description: Too many attempts }
        "503": { description: Authentication unavailable }
  /auth/logout:
    post:
      operationId: logoutCustomer
      summary: Clear the customer session cookie
      responses:
        "204": { description: Logged out }
        "403": { description: Cross-site request refused }
  /auth/me:
    get:
      operationId: getCustomerSession
      summary: Read the signed-in customer, or null
      responses:
        "200":
          description: Customer session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerSession" }
        "503": { description: Authentication unavailable }
  /catalog:
    get:
      operationId: getCatalog
      summary: Read the live Brew catalog
      responses:
        "200":
          description: Products and bundles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
        "503":
          description: Database unavailable
  /admin/catalog:
    get:
      operationId: getAdminCatalog
      summary: Read the catalog after verifying administrator access
      responses:
        "200":
          description: Administrator catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
        "401":
          description: Sign in required
        "403":
          description: Administrator access required
        "503":
          description: Database unavailable
    post:
      operationId: createCatalogEntry
      summary: Create a product or bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEntryInput"
        "400":
          description: Invalid catalog entry
        "401":
          description: Sign in required
        "403":
          description: Administrator access required
        "409":
          description: Identifier already exists
        "503":
          description: Database unavailable
  /admin/catalog/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 80
    put:
      operationId: updateCatalogEntry
      summary: Replace a product or bundle without changing its identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogEntryInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEntryInput"
        "400":
          description: Invalid catalog entry
        "401":
          description: Sign in required
        "403":
          description: Administrator access required
        "404":
          description: Entry not found
        "409":
          description: Product name already exists
        "503":
          description: Database unavailable
    delete:
      operationId: deleteCatalogEntry
      summary: Remove a product or bundle
      responses:
        "204":
          description: Deleted
        "401":
          description: Sign in required
        "403":
          description: Administrator access required
        "404":
          description: Entry not found
        "409":
          description: Product is included in a bundle
        "503":
          description: Database unavailable
  /geo:
    get:
      operationId: getVisitorGeo
      summary: Locate the visitor without exposing the location API URL
      parameters:
        - in: query
          name: testip
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Country and first currency from the location provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorGeo"
        "400":
          description: Missing or invalid visitor IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorGeo"
        "503":
          description: Location unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorGeo"
  /rates:
    get:
      operationId: getExchangeRates
      summary: Get exchange rates based in KWD
      responses:
        "200":
          description: Exchange rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRates"
        "503":
          description: Exchange rates unavailable
  /chat:
    post:
      operationId: sendChatMessage
      summary: Ask the Brew shop assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReply"
        "400":
          description: Invalid message or history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReply"
        "429":
          description: Visitor or provider rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReply"
        "503":
          description: Assistant temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReply"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    CheckoutLineInput:
      type: object
      additionalProperties: false
      required: [id, quantity]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        quantity: { type: integer, minimum: 1, maximum: 99 }
    CheckoutInput:
      type: object
      additionalProperties: false
      required: [items, requestId, language]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/CheckoutLineInput" }
        requestId: { type: string, format: uuid }
        language: { type: string, enum: [en, ar] }
    CheckoutLink:
      type: object
      required: [sessionId, url]
      properties:
        sessionId: { type: string }
        url: { type: string, format: uri }
    CheckoutConfirmation:
      type: object
      additionalProperties: false
      required: [quoteId]
      properties:
        quoteId: { type: string, pattern: "^order_[a-f0-9]{40}$" }
    CheckoutQuote:
      type: object
      required: [quoteId, amountKwd, amountUsd, rate, expiresAt]
      properties:
        quoteId: { type: string }
        amountKwd: { type: number }
        amountUsd: { type: number }
        rate: { type: number }
        expiresAt: { type: string, format: date-time }
    CheckoutStatus:
      type: object
      required: [sessionId, status, amountKwd, amountUsd, items]
      properties:
        sessionId: { type: string }
        status: { type: string, enum: [paid, pending, expired] }
        amountKwd: { type: number }
        amountUsd: { type: number }
        items:
          type: array
          items: { $ref: "#/components/schemas/CheckoutLineInput" }
    CustomerUser:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }
    CustomerSession:
      type: object
      required: [user]
      properties:
        user:
          anyOf:
            - { $ref: "#/components/schemas/CustomerUser" }
            - { type: "null" }
    CustomerLoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 72 }
    CustomerSignupInput:
      allOf:
        - { $ref: "#/components/schemas/CustomerLoginInput" }
        - type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 100 }
    CustomerAuthError:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string, enum: [validation, email_in_use, invalid_credentials, rate_limited, cross_site, unavailable] }
    CatalogResponse:
      type: object
      required: [products, bundles]
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/CatalogProduct"
        bundles:
          type: array
          items:
            $ref: "#/components/schemas/CatalogBundle"
    CatalogProduct:
      type: object
      required: [id, name, price, category, image, description, why]
      properties:
        id: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 160 }
        price: { type: number, minimum: 0, maximum: 100000 }
        category: { type: string, enum: [machine, bean] }
        image: { type: string, minLength: 1, maxLength: 2000 }
        description: { type: string, maxLength: 2000 }
        why: { type: string, maxLength: 2000 }
        descriptionAr: { type: string, maxLength: 2000 }
        whyAr: { type: string, maxLength: 2000 }
        detailDescription: { type: string, maxLength: 4000 }
        detailDescriptionAr: { type: string, maxLength: 4000 }
        origin: { type: string, maxLength: 200 }
        originAr: { type: string, maxLength: 200 }
        bagSize: { type: string, maxLength: 80 }
    CatalogBundle:
      type: object
      required: [id, name, price, regular, items, note]
      properties:
        id: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 160 }
        price: { type: number, minimum: 0, maximum: 100000 }
        regular: { type: number, minimum: 0, maximum: 100000 }
        items:
          type: array
          minItems: 1
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 160 }
        note: { type: string, maxLength: 2000 }
        noteAr: { type: string, maxLength: 2000 }
    CatalogProductInput:
      allOf:
        - $ref: "#/components/schemas/CatalogProduct"
        - type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [product] }
    CatalogBundleInput:
      allOf:
        - $ref: "#/components/schemas/CatalogBundle"
        - type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [bundle] }
    CatalogEntryInput:
      oneOf:
        - $ref: "#/components/schemas/CatalogProductInput"
        - $ref: "#/components/schemas/CatalogBundleInput"
    VisitorGeo:
      type: object
      required: [countryCode, currency]
      properties:
        countryCode:
          type: [string, "null"]
        currency:
          type: [string, "null"]
    ExchangeRates:
      type: object
      required: [result, base_code, rates]
      properties:
        result:
          type: string
          enum: [success]
        base_code:
          type: string
          enum: [KWD]
        rates:
          type: object
          additionalProperties:
            type: number
            minimum: 0
    ChatInput:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: "#/components/schemas/ChatMessage"
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 500
    ChatReply:
      type: object
      required: [reply]
      properties:
        reply:
          type: string
        error:
          type: string
          enum: [invalid_message, rate_limited, unavailable]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

